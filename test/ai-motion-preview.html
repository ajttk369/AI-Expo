<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Motion Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #050607;
      color: #f7fbfc;
      font-family: Arial, sans-serif;
    }

    .motion-preview {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      display: grid;
      place-items: center;
      padding: 48px;
    }

    .motion-preview::before,
    .motion-preview::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .motion-preview::before {
      z-index: -1;
      background:
        radial-gradient(circle at 18% 22%, rgba(0, 229, 255, 0.28), transparent 28%),
        radial-gradient(circle at 82% 62%, rgba(126, 242, 200, 0.16), transparent 30%),
        linear-gradient(180deg, rgba(5, 6, 7, 0.1), rgba(5, 6, 7, 0.88));
      mix-blend-mode: screen;
    }

    .motion-preview::after {
      z-index: 5;
      background:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(180deg, transparent, black 18%, black 82%, transparent);
      animation: gridMove 12s linear infinite;
    }

    .slide {
      position: absolute;
      inset: 0;
      z-index: -3;
      background-position: center;
      background-size: cover;
      opacity: 0;
      transform: scale(1.08);
      animation: cinematicSlide 30s infinite;
    }

    .slide:nth-child(1) {
      background-image: url("images/hero-ai-expo.png");
      animation-delay: 0s;
    }

    .slide:nth-child(2) {
      background-image: url("images/robotics-modern.png");
      animation-delay: 5s;
    }

    .slide:nth-child(3) {
      background-image: url("images/smart-city-modern.png");
      animation-delay: 10s;
    }

    .slide:nth-child(4) {
      background-image: url("images/cyber-ai-modern.png");
      animation-delay: 15s;
    }

    .slide:nth-child(5) {
      background-image: url("images/ai-medical-modern.png");
      animation-delay: 20s;
    }

    .slide:nth-child(6) {
      background-image: url("images/technology-ai-showcase.png");
      animation-delay: 25s;
    }

    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 22%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.75), transparent);
      box-shadow: 0 0 28px rgba(0, 229, 255, 0.7);
      animation: scan 5.5s ease-in-out infinite;
    }

    .content {
      position: relative;
      z-index: 10;
      width: min(980px, 100%);
      text-align: center;
    }

    .content small {
      display: inline-flex;
      margin-bottom: 22px;
      color: #7ef2c8;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.18em;
    }

    .content h1 {
      font-size: clamp(48px, 8vw, 112px);
      line-height: 0.9;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 0 0 28px rgba(0, 229, 255, 0.6), 0 18px 60px rgba(0, 0, 0, 0.72);
    }

    .content p {
      max-width: 680px;
      margin: 28px auto 0;
      color: #d9e2e6;
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.7;
    }

    .chips {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 34px;
    }

    .chips span {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 999px;
      background: rgba(5, 6, 7, 0.46);
      color: #f2f7f8;
      font-size: 13px;
      font-weight: 900;
      backdrop-filter: blur(14px);
    }

    @keyframes cinematicSlide {
      0% {
        opacity: 0;
        transform: scale(1.08) translate3d(0, 0, 0);
      }

      5%,
      17% {
        opacity: 1;
      }

      25% {
        opacity: 0;
        transform: scale(1.16) translate3d(-1.8%, -1%, 0);
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes gridMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 72px 72px;
      }
    }

    @keyframes scan {
      0%,
      100% {
        top: 18%;
        opacity: 0.2;
      }

      50% {
        top: 76%;
        opacity: 0.86;
      }
    }

    @media (max-width: 640px) {
      .motion-preview {
        padding: 28px;
      }

      .chips {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main class="motion-preview">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="scan-line"></div>

    <section class="content">
      <small>AI FUTURE EXPO</small>
      <h1>AI MOTION<br>PREVIEW</h1>
      <p>Generated AI exhibition images move like a cinematic preview with depth, scan light, and data-grid motion.</p>
      <div class="chips">
        <span>Robotics</span>
        <span>Smart City</span>
        <span>Cyber AI</span>
        <span>AI Medical</span>
      </div>
    </section>
  </main>
</body>
</html>
